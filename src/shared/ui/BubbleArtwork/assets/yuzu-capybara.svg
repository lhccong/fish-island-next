<svg xmlns="http://www.w3.org/2000/svg" width="280" height="112" viewBox="0 0 280 112" role="img">
  <title>柚子水豚</title>
  <defs>
    <style>
      :root {
        --bubble-top: #fffcf0;
        --bubble-mid: #fff0ca;
        --bubble-bottom: #fbd99f;
        --bubble-edge: #dda865;
        --bubble-accent: #92562d;
        --bubble-gloss: #ffffff;
        --bubble-gloss-opacity: .82;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bubble-top: #483124;
          --bubble-mid: #483024;
          --bubble-bottom: #38271f;
          --bubble-edge: #9b704b;
          --bubble-accent: #f3bd77;
          --bubble-gloss: #f3bd77;
          --bubble-gloss-opacity: .24;
        }
      }

      .accent-line {
        fill: none;
        stroke: var(--bubble-accent);
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sticker-gloss {
        fill: none;
        stroke: white;
        stroke-width: 1.55;
        stroke-linecap: round;
        opacity: .82;
      }
    </style>
    <path id="bubble" d="M37 23h210c15 0 23 11 23 26v15c0 16-11 25-25 25H37C20 89 10 78 10 62V50c0-15 11-27 27-27Z"/>
    <clipPath id="inside"><use href="#bubble"/></clipPath>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--bubble-top)"/>
      <stop offset=".52" stop-color="var(--bubble-mid)"/>
      <stop offset="1" stop-color="var(--bubble-bottom)"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--bubble-gloss)" stop-opacity="var(--bubble-gloss-opacity)"/>
      <stop offset=".43" stop-color="var(--bubble-gloss)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sticker" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#f5d1ab"/>
      <stop offset=".46" stop-color="#e9b58b"/>
      <stop offset="1" stop-color="#c98c61"/>
    </linearGradient>
  </defs>
  <use href="#bubble" transform="translate(0 2.5)" fill="var(--bubble-edge)" opacity=".18"/>
  <use href="#bubble" fill="url(#surface)" stroke="var(--bubble-edge)" stroke-width="1.35"/>
  <rect x="15" y="27" width="250" height="58" rx="22" fill="url(#gloss)" clip-path="url(#inside)"/>
  <path d="M17 22c4-7 17-10 27-6 8 3 9 11 4 17-5 7-19 8-27 4-5-3-7-10-4-15Z" fill="#ffce77" stroke="#b67943" stroke-width="1.35"/>
