<svg xmlns="http://www.w3.org/2000/svg" width="280" height="112" viewBox="0 0 280 112" role="img">
  <title>黑糖星冻</title>
  <defs>
    <style>
      :root {
        --bubble-top: #46434e;
        --bubble-mid: #302e39;
        --bubble-bottom: #211f29;
        --bubble-edge: #777281;
        --bubble-accent: #d5c298;
        --bubble-gloss: #d4c7db;
        --bubble-gloss-opacity: .21;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bubble-top: #383745;
          --bubble-mid: #282734;
          --bubble-bottom: #201f2a;
          --bubble-edge: #666474;
          --bubble-accent: #dcd2ad;
          --bubble-gloss: #d4c7db;
          --bubble-gloss-opacity: .24;
        }
      }

      .accent-line {
        fill: none;
        stroke: var(--bubble-accent);
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sticker-gloss {
        fill: none;
        stroke: white;
        stroke-width: 1.55;
        stroke-linecap: round;
        opacity: .82;
      }
    </style>
    <path id="bubble" d="M36 23h208c15 0 26 11 26 26v16c0 15-11 24-25 24H36C20 89 10 79 10 64V48c0-15 10-25 26-25Z"/>
    <clipPath id="inside"><use href="#bubble"/></clipPath>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--bubble-top)"/>
      <stop offset=".52" stop-color="var(--bubble-mid)"/>
      <stop offset="1" stop-color="var(--bubble-bottom)"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--bubble-gloss)" stop-opacity="var(--bubble-gloss-opacity)"/>
      <stop offset=".43" stop-color="var(--bubble-gloss)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sticker" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#fff8db"/>
      <stop offset=".46" stop-color="#f3d899"/>
      <stop offset="1" stop-color="#d7a967"/>
    </linearGradient>
  </defs>
  <use href="#bubble" transform="translate(0 2.5)" fill="var(--bubble-edge)" opacity=".18"/>
  <use href="#bubble" fill="url(#surface)" stroke="var(--bubble-edge)" stroke-width="1.35"/>
  <rect x="15" y="27" width="250" height="58" rx="22" fill="url(#gloss)" clip-path="url(#inside)"/>
  <path d="M20 47c0-9 5-15 12-17m5-1 5-.4" fill="none" stroke="#fff7ec" stroke-width="2.8" stroke-linecap="round" opacity=".62"/>
  <path d="M45 8c1.7 7.7 4.3 10.6 12 12-7.7 1.4-10.3 4.1-12 12-1.6-7.9-4.4-10.6-12-12 7.6-1.4 10.4-4.3 12-12Z" fill="url(#sticker)" stroke="#bd9b60" stroke-width="1.15"/>
  <path d="M45 14c-.9 3.7-2.7 5.3-6.3 6.1" class="sticker-gloss"/>
  <circle cx="59" cy="12" r="1.55" fill="#dba86a"/><circle cx="26" cy="15" r="2.4" fill="#a188ac"/>
  <path d="M225 95c3 4 12 5 27-1 15-6 21-13 17-16-2-2-6-2-10-1" fill="none" stroke="#d2ad7e" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M246 69c1.6 7 4.1 9.5 11 11-6.9 1.6-9.4 4.1-11 11-1.5-6.9-4-9.4-11-11 7-1.5 9.5-4 11-11Z" fill="url(#sticker)" stroke="#ab8354" stroke-width="1"/>
  <path d="M246 74c-.8 3-2.3 4.7-5.8 5.8" class="sticker-gloss"/>
  <path d="M265 92c.9 3.1 2 4.2 5.2 5.1-3.2.9-4.3 2-5.2 5.1-.9-3.1-2-4.2-5.2-5.1 3.2-.9 4.3-2 5.2-5.1Z" fill="#d8b683"/>
  <circle cx="230" cy="76" r="1.6" fill="#daba89"/>
  <circle cx="253" cy="101" r="1.6" fill="#a88fb5"/>
</svg>
