<svg xmlns="http://www.w3.org/2000/svg" width="280" height="112" viewBox="0 0 280 112" role="img">
  <title>月光水母</title>
  <defs>
    <style>
      :root {
        --bubble-top: #fbf8ff;
        --bubble-mid: #eee7ff;
        --bubble-bottom: #dcd0ff;
        --bubble-edge: #bca9e9;
        --bubble-accent: #68529e;
        --bubble-gloss: #ffffff;
        --bubble-gloss-opacity: .82;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bubble-top: #3c3155;
          --bubble-mid: #352b4b;
          --bubble-bottom: #2d2542;
          --bubble-edge: #8270ae;
          --bubble-accent: #c3aff4;
          --bubble-gloss: #c3aff4;
          --bubble-gloss-opacity: .24;
        }
      }

      .accent-line {
        fill: none;
        stroke: var(--bubble-accent);
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sticker-gloss {
        fill: none;
        stroke: white;
        stroke-width: 1.55;
        stroke-linecap: round;
        opacity: .82;
      }
    </style>
    <path id="bubble" d="M37 23h203c17 0 29 12 29 27v11c0 16-10 28-28 28H38C21 89 11 77 11 61V50c0-15 10-27 26-27Z"/>
    <clipPath id="inside"><use href="#bubble"/></clipPath>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--bubble-top)"/>
      <stop offset=".52" stop-color="var(--bubble-mid)"/>
      <stop offset="1" stop-color="var(--bubble-bottom)"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--bubble-gloss)" stop-opacity="var(--bubble-gloss-opacity)"/>
      <stop offset=".43" stop-color="var(--bubble-gloss)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sticker" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#f8f3ff"/>
      <stop offset=".46" stop-color="#e5d5ff"/>
      <stop offset="1" stop-color="#b49be9"/>
    </linearGradient>
  </defs>
  <use href="#bubble" transform="translate(0 2.5)" fill="var(--bubble-edge)" opacity=".18"/>
  <use href="#bubble" fill="url(#surface)" stroke="var(--bubble-edge)" stroke-width="1.35"/>
  <rect x="15" y="27" width="250" height="58" rx="22" fill="url(#gloss)" clip-path="url(#inside)"/>
  <path d="M34 8c-2 8 5 15 13 13l3-1c-1 8-8 14-16 13-7-1-12-7-11-14 1-5 5-10 11-11Z" fill="#fff0b6" stroke="#b18ac0" stroke-width="1.25"/>
  <path d="M28 17c-2.5 5-.4 10 4 12" class="sticker-gloss"/>
  <path d="m15 14 1.2 3.2 3.3 1-3.3 1.1L15 23l-1-3.7-3.6-1.1 3.6-1Zm39 11 .9 2.8 2.9.9-2.9 1-.9 2.8-.9-2.8-2.8-1 2.8-.9Z" fill="#ad94d7"/>
  <circle cx="43.6" cy="14" r="1.45" fill="#a893d6"/>
  <path d="M236 87c-6 9 6 10 0 16m10-15c-3 6 5 9 1 17m9-17c-2 4 4 7 2 13m7-16c-1 4 5 6 3 11" fill="none" stroke="#a78cdb" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M225 83c1-8 8-15 19-16 11-1 21 4 24 12 3 7-4 10-9 8-3 4-9 4-13 1-4 3-10 3-13 0-4 1-9 0-8-5Z" fill="url(#sticker)" stroke="#8a70c5" stroke-width="1.4"/>
  <path d="M236 73c3-2 7-2.5 10-2.3" class="sticker-gloss"/>
  <circle cx="239.5" cy="81.7" r="1.4" fill="#58447d"/><circle cx="252.5" cy="81.7" r="1.4" fill="#58447d"/>
  <path d="M244.5 83.5q1.5 2 3 0" fill="none" stroke="#58447d" stroke-linecap="round"/>
  <ellipse cx="235" cy="84.5" rx="2.35" ry="1.15" fill="#f0a9d3"/><ellipse cx="257" cy="84.5" rx="2.35" ry="1.15" fill="#f0a9d3"/>
  <path d="m274 68 1.1 3 3 .9-3 1-1.1 3-1-3-3.1-1 3.1-.9Z" fill="#b398e6"/>
</svg>
