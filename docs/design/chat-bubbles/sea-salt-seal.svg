<svg xmlns="http://www.w3.org/2000/svg" width="280" height="112" viewBox="0 0 280 112" role="img">
  <title>海盐小海豹</title>
  <defs>
    <style>
      :root {
        --bubble-top: #f3fefa;
        --bubble-mid: #def6ee;
        --bubble-bottom: #bce8da;
        --bubble-edge: #95c4b8;
        --bubble-accent: #377b72;
        --bubble-gloss: #ffffff;
        --bubble-gloss-opacity: .82;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bubble-top: #27403f;
          --bubble-mid: #233e3b;
          --bubble-bottom: #243230;
          --bubble-edge: #588d82;
          --bubble-accent: #a5dac8;
          --bubble-gloss: #a5dac8;
          --bubble-gloss-opacity: .24;
        }
      }

      .accent-line {
        fill: none;
        stroke: var(--bubble-accent);
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sticker-gloss {
        fill: none;
        stroke: white;
        stroke-width: 1.55;
        stroke-linecap: round;
        opacity: .82;
      }
    </style>
    <path id="bubble" d="M34 24h207c17 0 29 10 29 26v12c0 16-12 27-28 27H35C20 89 10 78 10 62V48c0-14 10-24 24-24Z"/>
    <clipPath id="inside"><use href="#bubble"/></clipPath>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--bubble-top)"/>
      <stop offset=".52" stop-color="var(--bubble-mid)"/>
      <stop offset="1" stop-color="var(--bubble-bottom)"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="var(--bubble-gloss)" stop-opacity="var(--bubble-gloss-opacity)"/>
      <stop offset=".43" stop-color="var(--bubble-gloss)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sticker" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#f7fffd"/>
      <stop offset=".46" stop-color="#e9fbf8"/>
      <stop offset="1" stop-color="#b8dcd9"/>
    </linearGradient>
  </defs>
  <use href="#bubble" transform="translate(0 2.5)" fill="var(--bubble-edge)" opacity=".18"/>
  <use href="#bubble" fill="url(#surface)" stroke="var(--bubble-edge)" stroke-width="1.35"/>
  <rect x="15" y="27" width="250" height="58" rx="22" fill="url(#gloss)" clip-path="url(#inside)"/>
  <path d="M25 34c-5-3-10-7-11-12-.4-3 1.2-5.7 4.3-6.3 1-4 5-5.4 8.5-3.9 2.5-3 6.7-2.6 9.1.1 3.7-1 7.7 1.1 8.1 5.2 3.4 2.1 3.8 5.5 2 8-2.7 4.1-9.3 6.8-15 9.4-2.2 1-4 1-6-.5Z" fill="#d0f2e7" stroke="#659d92" stroke-width="1.25"/>
  <path d="M20 18c1.6 3.6 3.6 7 6.5 10.8m1.1-14.3 1.7 13.2m7.1-13.1-4.3 13.5m9.5-8.3-6.6 9.1" fill="none" stroke="#94c5b9" stroke-width="1.2" stroke-linecap="round"/>
  <path d="m52 13 1 2.8 2.8 1-2.8 1-1 2.8-1-2.8-2.8-1 2.8-1Z" fill="#8bc4b6"/>
  <circle cx="53.5" cy="29" r="2" fill="#a9d7ca" stroke="#75a99f" stroke-width="1"/>
  <path d="M252 88c5-8 11-11 16-10 1 3 0 6-2 8 3-1 6.5.2 8.5 2.5-3 5-9 6-15.5 5.5Z" fill="#bbdedb" stroke="#679d99" stroke-width="1.3"/>
  <path d="M225 88c-1-8 5-15 13-17 8-3 17 0 21 6 4 5 4 11 1 15-4 5-11 6-19 6-9 0-14-3-16-10Z" fill="url(#sticker)" stroke="#679d99" stroke-width="1.4"/>
  <path d="M239 74c-4 1-6 2.3-7.5 4.5m13.5-5.5h1.5" class="sticker-gloss"/>
  <path d="M227 91c-1 3 .3 6 3.5 7 3.2 1 6.5.6 8.3-1.4" fill="#c5e7e3" stroke="#679d99" stroke-width="1.2"/>
  <circle cx="234.6" cy="85.1" r="1.45" fill="#365551"/><circle cx="248.6" cy="85.1" r="1.45" fill="#365551"/>
  <path d="M240 87c.8-.7 2.2-.7 3 0-1 1.7-2 1.7-3 0Zm1.5 1.1v1.1m0 0q-1 1.4-2.3.9m2.3-.9q1 1.4 2.3.9" fill="#365551" stroke="#365551" stroke-width=".9" stroke-linecap="round"/>
  <path d="m231 88-3-1m3 3-3 .2m24-2.2 3-.8m-3 2.8 3 .2" fill="none" stroke="#79aaa2" stroke-linecap="round"/>
  <circle cx="219.5" cy="94" r="2.2" fill="#b2e4d7" stroke="#76a99e" stroke-width="1"/>
</svg>
