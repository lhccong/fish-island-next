<svg xmlns="http://www.w3.org/2000/svg" width="85.2" height="35.05" viewBox="-12 -12 85.2 35.05" role="img" aria-label="摸鱼专家"><title>摸鱼专家</title><style>.motion{animation:badge-sweep 2s ease infinite}@keyframes badge-sweep{0%{transform:translateX(0)}20%,100%{transform:translateX(144px)}}@media(prefers-reduced-motion:reduce){.surface,.type,.motion{animation:none}.motion{display:none}.surface{filter:url(#glow);fill:url(#bg-static)}}</style><defs><linearGradient id="bg-static" gradientUnits="userSpaceOnUse" x1="14.75" y1="-14.75" x2="57.25" y2="27.75"><stop offset="0" stop-color="rgb(255, 71, 87)"/><stop offset="1" stop-color="rgb(255, 107, 129)"/></linearGradient><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="14.75" y1="-14.75" x2="57.25" y2="27.75"><stop offset="0" stop-color="rgb(255, 71, 87)"/><stop offset="1" stop-color="rgb(255, 107, 129)"/></linearGradient><filter id="glow" x="-100%" y="-200%" width="300%" height="500%"><feDropShadow in="SourceGraphic" dx="0" dy="2" stdDeviation="2" flood-color="rgba(255, 71, 87, 0.3)" result="s0"/><feMerge><feMergeNode in="s0"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="text" x="-30%" y="-100%" width="160%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation=".5" flood-color="black" flood-opacity=".15"/></filter><clipPath id="clip"><rect width="72" height="13" rx="6"/></clipPath><linearGradient id="sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".3"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient></defs><g transform="scale(.85)"><rect class="surface" width="72" height="13" rx="6" fill="url(#bg)" filter="url(#glow)"/><g class="type" clip-path="url(#clip)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" fill="white"><rect class="motion" x="-72" width="72" height="13" fill="url(#sweep)"/><text x="6" y="11" font-size="11" filter="url(#text)">🎣<tspan fill="white" dx="2" font-size="11" font-weight="500" letter-spacing="0.3">摸鱼专家</tspan></text></g></g></svg>
