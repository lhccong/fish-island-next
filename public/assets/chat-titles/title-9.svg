<svg xmlns="http://www.w3.org/2000/svg" width="96.25" height="35.05" viewBox="-12 -12 96.25 35.05" role="img" aria-label="摸鱼大法师"><title>摸鱼大法师</title><style>.surface{animation:badge-shadow 2s infinite alternate}.type{animation:badge-light 2s infinite alternate}@keyframes badge-shadow{0%{filter:drop-shadow(0px 0px 2.5px rgba(230, 184, 0, 0.5)) drop-shadow(0px 0px 5px rgba(255, 217, 102, 0.3)) }100%{filter:drop-shadow(0px 0px 7.5px rgba(230, 184, 0, 0.8)) drop-shadow(0px 0px 10px rgba(255, 217, 102, 0.6)) }}@keyframes badge-light{0%{filter:none}100%{filter:none}}@media(prefers-reduced-motion:reduce){.surface,.type,.motion{animation:none}.motion{display:none}.surface{filter:url(#glow);fill:url(#bg-static)}}</style><defs><linearGradient id="bg-static" gradientUnits="userSpaceOnUse" x1="18" y1="-18" x2="67" y2="31"><stop offset="0" stop-color="rgb(255, 217, 102)"/><stop offset="1" stop-color="rgb(230, 184, 0)"/></linearGradient><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="18" y1="-18" x2="67" y2="31"><stop offset="0" stop-color="rgb(255, 217, 102)"/><stop offset="1" stop-color="rgb(230, 184, 0)"/></linearGradient><filter id="glow" x="-100%" y="-200%" width="300%" height="500%"><feDropShadow in="SourceGraphic" dx="0" dy="2" stdDeviation="3" flood-color="rgba(230, 184, 0, 0.4)" result="s0"/><feMerge><feMergeNode in="s0"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="text" x="-30%" y="-100%" width="160%" height="300%"><feDropShadow dx="0" dy="1" stdDeviation=".5" flood-color="black" flood-opacity=".15"/></filter><clipPath id="clip"><rect width="85" height="13" rx="6"/></clipPath></defs><g transform="scale(.85)"><rect class="surface" width="85" height="13" rx="6" fill="url(#bg)" filter="url(#glow)"/><g class="type" clip-path="url(#clip)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;" fill="white"><text x="6" y="11" font-size="11" filter="url(#text)">💀<tspan fill="white" dx="2" font-size="11" font-weight="600" letter-spacing="0.5">摸鱼大法师</tspan></text></g></g></svg>
